# Render Blueprint - Deploy backend and AI service together
# https://render.com/docs/blueprint-spec

services:
  # Node.js Backend API
  - type: web
    name: projectalloc-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false  # You'll set this manually
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: projectalloc-ai
          property: host
      - key: PORT
        value: 5000

  # Python FastAPI AI Service
  - type: web
    name: projectalloc-ai
    env: python
    region: oregon
    plan: free
    buildCommand: cd ai-service && pip install -r requirements.txt
    startCommand: cd ai-service && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false  # You'll set this manually
      - key: PYTHON_VERSION
        value: "3.11"
